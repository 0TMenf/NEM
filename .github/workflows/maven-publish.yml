# 构建并发布 Notch_Escape_Mini
# 触发条件：
#   1. push 到 main / master
#   2. 创建 Pull Request
#   3. 创建 Release（会自动上传 jar 到 Release 附件）
#   4. 手动触发（workflow_dispatch）

name: Maven Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [ created ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # 1. 拉取代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 配置 JDK 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # 3. 缓存 Maven 依赖，加快后续构建
      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # 4. 编译打包
      - name: Build with Maven
        run: mvn -B clean package --file pom.xml

      # 5. 上传构建产物（每次构建都能在 Actions 页面的 Artifacts 里下载）
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Notch_Escape_Mini-${{ github.sha }}
          path: target/*.jar
          if-no-files-found: error

      # 6. 如果是创建 Release，自动把 jar 附加到 Release 里
      - name: Upload jar to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: target/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
